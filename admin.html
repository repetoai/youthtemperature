<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리 — 청춘의 온도</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090c18;--cream:#efe9dc;--cream-2:#a9a396;--line:rgba(239,233,220,.14);--serif:"Gowun Batang",serif;--sans:"IBM Plex Sans KR",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--cream);line-height:1.6;padding:clamp(20px,4vw,48px)}
h1{font-family:var(--serif);font-weight:400;font-size:28px}
.sub{color:var(--cream-2);font-size:13px;margin-top:4px}
.card{border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px;background:rgba(239,233,220,.02)}
input,button{font:inherit;color:inherit}
input[type=password]{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(239,233,220,.04);width:260px;max-width:100%}
button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer}
button:hover{border-color:var(--cream)}
button.danger{color:#f08080;border-color:rgba(240,128,128,.4)}button.danger:hover{background:rgba(240,128,128,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1}.stat span{font-size:12px;color:var(--cream-2)}
.strip{margin-top:18px;height:10px;border-radius:10px;background:var(--line);position:relative}
.strip i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);opacity:.75}
.lab{display:flex;justify-content:space-between;font-size:11px;color:var(--cream-2);margin-top:6px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--cream-2);font-size:12px;border-top:0}
td.t{font-family:var(--serif);white-space:nowrap}
td.text{font-family:var(--serif);font-size:15px}
td.who{color:var(--cream-2);font-size:12px;white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
.status{font-size:13px;color:var(--cream-2);min-height:1.4em;margin-top:10px}
.search{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(239,233,220,.04);min-width:220px}
#panel{display:none}
</style>
</head>
<body>
<h1>청춘의 온도 — 관리</h1>
<p class="sub">온도 남기기에 쌓인 기록을 보고, 지우고, 내보냅니다. 이 페이지는 검색에 노출되지 않지만 주소를 아는 사람은 열 수 있으니 관리자 비밀번호는 공유하지 마세요.</p>

<div class="card" id="login">
  <div class="row">
    <input type="password" id="pw" placeholder="관리자 비밀번호 (ADMIN_TOKEN)">
    <button id="btnLogin">들어가기</button>
    <span class="status" id="lstatus"></span>
  </div>
</div>

<div id="panel">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row"><button id="btnReload">새로고침</button><button id="btnCsv">CSV 내보내기</button><input class="search" id="q" placeholder="문장·닉네임 검색"></div>
      <div class="row"><button class="danger" id="btnAll">전체 삭제</button><button id="btnLogout">나가기</button></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="strip" id="strip"></div><div class="lab"><span>0℃</span><span>10℃</span><span>20℃</span><span>30℃</span><span>40℃</span></div>
    <div class="status" id="status"></div>
  </div>
  <div class="card" style="padding:8px 20px 20px">
    <table><thead><tr><th>온도</th><th>한 줄</th><th>닉네임 · 시간</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STOPS=[[0,'#4f86c6'],[15,'#4fb39a'],[24,'#b9c94a'],[31,'#f0a13a'],[40,'#f06a6a']];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const col=t=>{for(let j=0;j<4;j++){if(t<=STOPS[j+1][0]){const a=hex(STOPS[j][1]),b=hex(STOPS[j+1][1]),p=(t-STOPS[j][0])/(STOPS[j+1][0]-STOPS[j][0]);return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*p)).join(',')})`;}}return STOPS[4][1];};
let token=sessionStorage.getItem('ondo_admin')||'',notes=[];
const auth=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});
async function load(){
  $('status').textContent='불러오는 중…';
  const r=await fetch('/api/notes?all=1',{headers:auth()});
  if(r.status===401){logout('비밀번호가 맞지 않거나 ADMIN_TOKEN 이 설정되지 않았습니다.');return false;}
  if(r.status===503){$('status').textContent='저장소(Upstash Redis)가 아직 연결되지 않았습니다.';notes=[];render();return true;}
  const j=await r.json();notes=j.notes||[];$('status').textContent=`${notes.length}건 (최대 ${j.max}건 보관)`;render();return true;
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const list=q?notes.filter(n=>(n.text+' '+(n.name||'')).toLowerCase().includes(q)):notes;
  const avg=notes.length?notes.reduce((a,n)=>a+n.temp,0)/notes.length:0;
  const today=notes.filter(n=>Date.now()-n.ts<864e5).length;
  const cold=notes.filter(n=>n.temp<15).length,warm=notes.filter(n=>n.temp>=31).length;
  $('stats').innerHTML=[['전체',notes.length,'건'],['평균 온도',avg.toFixed(1),'℃'],['최근 24시간',today,'건'],['15℃ 미만',cold,'건'],['31℃ 이상',warm,'건']].map(([l,v,u])=>`<div class="stat"><b>${v}<small style="font-size:14px"> ${u}</small></b><span>${l}</span></div>`).join('');
  $('strip').innerHTML=notes.slice(0,300).map(n=>`<i style="left:${n.temp/40*100}%;background:${col(n.temp)}"></i>`).join('');
  $('rows').innerHTML=list.map(n=>`<tr data-ts="${n.ts}"><td class="t" style="color:${col(n.temp)}">${Number(n.temp).toFixed(1)}℃</td><td class="text">${esc(n.text)}</td><td class="who">${esc(n.name||'익명')}<br>${new Date(n.ts).toLocaleString('ko-KR')}</td><td class="act"><button class="danger del">삭제</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--cream-2)">기록이 없습니다.</td></tr>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=async e=>{const tr=e.target.closest('tr');const n=notes.find(x=>String(x.ts)===tr.dataset.ts);if(!confirm(`삭제할까요?\n\n${n.temp}℃ · ${n.text}`))return;
    const r=await fetch('/api/notes',{method:'DELETE',headers:auth(),body:JSON.stringify({ts:n.ts})});if(r.ok){notes=notes.filter(x=>x.ts!==n.ts);render();$('status').textContent='삭제했습니다.';}else $('status').textContent='삭제에 실패했습니다.';});
}
function logout(msg){token='';sessionStorage.removeItem('ondo_admin');$('panel').style.display='none';$('login').style.display='';$('lstatus').textContent=msg||'';}
$('btnLogin').onclick=async()=>{token=$('pw').value.trim();if(!token)return;sessionStorage.setItem('ondo_admin',token);$('lstatus').textContent='확인 중…';if(await load()){$('login').style.display='none';$('panel').style.display='';}};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnLogin').click();});
$('btnLogout').onclick=()=>logout();
$('btnReload').onclick=load;
$('q').addEventListener('input',render);
$('btnCsv').onclick=()=>{const rows=[['온도','한 줄','닉네임','시간'],...notes.map(n=>[n.temp,n.text,n.name||'',new Date(n.ts).toISOString()])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='온도남기기_'+new Date().toISOString().slice(0,10)+'.csv';a.click();};
$('btnAll').onclick=async()=>{if(!confirm('모든 기록을 삭제합니다. 되돌릴 수 없습니다. 계속할까요?'))return;if(prompt('확인을 위해 "삭제"라고 입력하세요')!=='삭제')return;const r=await fetch('/api/notes',{method:'DELETE',headers:auth(),body:JSON.stringify({all:true})});if(r.ok){notes=[];render();$('status').textContent='모두 삭제했습니다.';}};
if(token){load().then(ok=>{if(ok){$('login').style.display='none';$('panel').style.display='';}});}
</script>
</body>
</html>
